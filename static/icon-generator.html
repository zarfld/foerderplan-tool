<!doctype html>
<html>
	<head>
		<title>Icon Generator</title>
	</head>
	<body>
		<canvas id="canvas192" width="192" height="192"></canvas>
		<canvas id="canvas512" width="512" height="512"></canvas>

		<script>
			function generateIcon(canvas, size) {
				const ctx = canvas.getContext('2d');

				// Background
				ctx.fillStyle = '#2563eb';
				ctx.fillRect(0, 0, size, size);

				// Rounded corners
				const radius = size * 0.125; // 24px for 192px
				ctx.beginPath();
				ctx.roundRect(0, 0, size, size, radius);
				ctx.fill();

				// Document lines
				const scale = size / 192;
				ctx.fillStyle = 'white';

				// Line 1
				ctx.fillRect(48 * scale, 64 * scale, 96 * scale, 16 * scale);
				// Line 2
				ctx.fillRect(48 * scale, 88 * scale, 96 * scale, 16 * scale);
				// Line 3 (shorter)
				ctx.fillRect(48 * scale, 112 * scale, 72 * scale, 16 * scale);

				// Checkmark circle
				ctx.beginPath();
				ctx.arc(152 * scale, 120 * scale, 12 * scale, 0, 2 * Math.PI);
				ctx.fill();

				// Checkmark
				ctx.strokeStyle = '#2563eb';
				ctx.lineWidth = 3 * scale;
				ctx.lineCap = 'round';
				ctx.lineJoin = 'round';
				ctx.beginPath();
				ctx.moveTo(144 * scale, 128 * scale);
				ctx.lineTo(152 * scale, 136 * scale);
				ctx.lineTo(168 * scale, 120 * scale);
				ctx.stroke();

				// Text
				ctx.fillStyle = 'white';
				ctx.font = `${14 * scale}px Arial, sans-serif`;
				ctx.textAlign = 'center';
				ctx.fillText('Förderplan', 96 * scale, 156 * scale);
			}

			// Generate both sizes
			generateIcon(document.getElementById('canvas192'), 192);
			generateIcon(document.getElementById('canvas512'), 512);

			// Convert to downloadable links
			setTimeout(() => {
				const canvas192 = document.getElementById('canvas192');
				const canvas512 = document.getElementById('canvas512');

				canvas192.toBlob((blob) => {
					console.log('192px icon ready');
				}, 'image/png');

				canvas512.toBlob((blob) => {
					console.log('512px icon ready');
				}, 'image/png');
			}, 100);
		</script>
	</body>
</html>
