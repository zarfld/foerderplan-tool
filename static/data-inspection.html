<!DOCTYPE html>
<html>
<head>
    <title>Inspect Local Data</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f5f5f5;
        }
        .data-item { 
            background: white; 
            margin: 10px 0; 
            padding: 15px; 
            border-radius: 8px;
            border-left: 4px solid #007acc;
        }
        .key { 
            font-weight: bold; 
            color: #007acc; 
            margin-bottom: 5px;
        }
        .value { 
            font-family: monospace; 
            background: #f8f8f8; 
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .summary {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .sync-test {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #005a9e;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Lokale Daten Inspektion</h1>
    
    <div class="summary">
        <h2>📊 Datensummary</h2>
        <div id="summary">Lade Daten...</div>
    </div>

    <div class="sync-test">
        <h2>🔄 CouchDB Sync Test</h2>
        <button onclick="testCouchDBConnection()">CouchDB Verbindung testen</button>
        <button onclick="syncToCloud()">Daten zu CouchDB synchronisieren</button>
        <div id="syncResults"></div>
    </div>

    <h2>📝 Alle lokalen Daten</h2>
    <div id="data-list">Lade Daten...</div>

    <script>
        // CouchDB Configuration
        const couchdbConfig = {
            localUrl: 'http://157.247.1.102:5984/',
            webUrl: 'https://couchdb.ettingshaus14.synology.me',
            username: 'Lehrer',
            password: 'jenAplan',
            databases: {
                test: 'foerderplan-test',
                production: 'foerderplan',
                backup: 'foerderplan-backup'
            }
        };

        let hybridDB = null;

        function displayData() {
            const summaryDiv = document.getElementById('summary');
            const dataDiv = document.getElementById('data-list');
            
            const foerderplanData = [];
            const otherData = [];
            let totalSize = 0;

            // Collect all localStorage data
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                const size = new Blob([value]).size;
                totalSize += size;

                const item = { key, value, size };

                if (key.startsWith('foerderplan_')) {
                    foerderplanData.push(item);
                } else {
                    otherData.push(item);
                }
            }

            // Display summary
            summaryDiv.innerHTML = `
                <p><strong>Gesamt:</strong> ${localStorage.length} Einträge (${(totalSize / 1024).toFixed(2)} KB)</p>
                <p><strong>Förderplan Daten:</strong> ${foerderplanData.length} Einträge</p>
                <p><strong>Andere Daten:</strong> ${otherData.length} Einträge</p>
            `;

            // Display föderplan data
            dataDiv.innerHTML = '';
            
            if (foerderplanData.length === 0) {
                dataDiv.innerHTML = '<p><em>Keine Förderplan-Daten gefunden</em></p>';
                return;
            }

            foerderplanData.forEach(item => {
                const dataItem = document.createElement('div');
                dataItem.className = 'data-item';
                
                let formattedValue;
                try {
                    const parsed = JSON.parse(item.value);
                    formattedValue = JSON.stringify(parsed, null, 2);
                } catch (e) {
                    formattedValue = item.value;
                }
                
                dataItem.innerHTML = `
                    <div class="key">${item.key} (${(item.size / 1024).toFixed(2)} KB)</div>
                    <div class="value">${formattedValue}</div>
                `;
                dataDiv.appendChild(dataItem);
            });
        }

        async function testCouchDBConnection() {
            const resultsDiv = document.getElementById('syncResults');
            resultsDiv.innerHTML = '<p>🔄 Teste CouchDB Verbindung...</p>';

            try {
                const response = await fetch(`${couchdbConfig.localUrl}_up`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Basic ' + btoa(`${couchdbConfig.username}:${couchdbConfig.password}`),
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    resultsDiv.innerHTML = '<div class="success">✅ CouchDB Verbindung erfolgreich!</div>';
                } else {
                    resultsDiv.innerHTML = `<div class="error">❌ CouchDB Verbindung fehlgeschlagen: ${response.status}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ CouchDB Verbindungsfehler: ${error.message}</div>`;
            }
        }

        async function initializeHybridDB() {
            const resultsDiv = document.getElementById('syncResults');
            resultsDiv.innerHTML = '<p>🔄 Initialisiere Hybrid Database...</p>';

            try {
                // For static HTML, we'll simulate the hybrid database functionality
                // by directly using CouchDB APIs and localStorage
                resultsDiv.innerHTML = '<div class="success">✅ Verwende vereinfachte CouchDB Integration!</div>';
                
                // Create a simple hybrid DB simulation
                hybridDB = {
                    async put(doc) {
                        // Save to localStorage
                        const key = `foerderplan_${doc._id}`;
                        localStorage.setItem(key, JSON.stringify(doc));
                        
                        // Try to save to CouchDB directly
                        const response = await fetch(`${couchdbConfig.localUrl}foerderplan/${doc._id}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'Basic ' + btoa(`${couchdbConfig.username}:${couchdbConfig.password}`),
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(doc)
                        });
                        
                        if (!response.ok) {
                            throw new Error(`CouchDB PUT failed: ${response.status}`);
                        }
                        
                        return await response.json();
                    },
                    
                    async manualSync() {
                        // This will be handled by the syncToCloud function
                        return true;
                    }
                };

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Initialisierung fehlgeschlagen: ${error.message}</div>`;
                console.error('Init error:', error);
            }
        }

        async function syncToCloud() {
            const resultsDiv = document.getElementById('syncResults');
            
            resultsDiv.innerHTML = '<p>🔄 Synchronisiere Daten zu CouchDB...</p>';

            try {
                // Test CouchDB connection first
                const testResponse = await fetch(`${couchdbConfig.localUrl}_up`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Basic ' + btoa(`${couchdbConfig.username}:${couchdbConfig.password}`),
                        'Content-Type': 'application/json'
                    }
                });

                if (!testResponse.ok) {
                    throw new Error(`CouchDB nicht erreichbar: ${testResponse.status}`);
                }

                // Get all local förderplan data
                const foerderplanData = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('foerderplan_')) {
                        try {
                            const value = localStorage.getItem(key);
                            if (value) {
                                const parsed = JSON.parse(value);
                                const docId = key.replace('foerderplan_', '');
                                
                                // Ensure the document has an _id
                                if (!parsed._id) {
                                    parsed._id = docId;
                                }
                                
                                foerderplanData.push(parsed);
                            }
                        } catch (e) {
                            console.warn('Skipping invalid JSON:', key);
                        }
                    }
                }

                console.log(`Found ${foerderplanData.length} documents to sync`);
                resultsDiv.innerHTML += `<p>📊 ${foerderplanData.length} Dokumente gefunden</p>`;

                // Check if database exists, create if needed
                const dbResponse = await fetch(`${couchdbConfig.localUrl}foerderplan`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Basic ' + btoa(`${couchdbConfig.username}:${couchdbConfig.password}`)
                    }
                });

                if (dbResponse.status === 404) {
                    // Create database
                    const createResponse = await fetch(`${couchdbConfig.localUrl}foerderplan`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'Basic ' + btoa(`${couchdbConfig.username}:${couchdbConfig.password}`)
                        }
                    });
                    
                    if (createResponse.ok) {
                        resultsDiv.innerHTML += '<p>✅ Datenbank erstellt</p>';
                    } else {
                        throw new Error('Konnte Datenbank nicht erstellen');
                    }
                }

                // Sync each document
                let successCount = 0;
                let errorCount = 0;
                
                for (const doc of foerderplanData) {
                    try {
                        // Check if document exists
                        const existingResponse = await fetch(`${couchdbConfig.localUrl}foerderplan/${doc._id}`, {
                            method: 'GET',
                            headers: {
                                'Authorization': 'Basic ' + btoa(`${couchdbConfig.username}:${couchdbConfig.password}`)
                            }
                        });

                        let docToSave = { ...doc };
                        
                        if (existingResponse.ok) {
                            // Document exists, get the revision
                            const existingDoc = await existingResponse.json();
                            docToSave._rev = existingDoc._rev;
                        }

                        // Save document
                        const saveResponse = await fetch(`${couchdbConfig.localUrl}foerderplan/${doc._id}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'Basic ' + btoa(`${couchdbConfig.username}:${couchdbConfig.password}`),
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(docToSave)
                        });

                        if (saveResponse.ok) {
                            successCount++;
                            console.log(`✅ Synced: ${doc._id}`);
                        } else {
                            errorCount++;
                            const errorText = await saveResponse.text();
                            console.error(`❌ Failed to sync: ${doc._id}`, errorText);
                        }
                    } catch (error) {
                        errorCount++;
                        console.error(`❌ Failed to sync: ${doc._id}`, error);
                    }
                }

                resultsDiv.innerHTML = `
                    <div class="success">
                        ✅ Synchronisation abgeschlossen!<br>
                        Erfolgreich: ${successCount}<br>
                        Fehler: ${errorCount}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Sync Fehler: ${error.message}</div>`;
                console.error('Sync error:', error);
            }
        }

        // Load data on page load
        displayData();
    </script>
</body>
</html>
